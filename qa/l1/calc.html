<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #eef2f7;
    }
    .calculator {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 12px 28px rgba(30, 41, 59, 0.14);
      width: 280px;
    }
    .display {
      width: 100%;
      height: 56px;
      font-size: 22px;
      font-weight: 600;
      text-align: right;
      padding: 10px;
      margin-bottom: 14px;
      color: #1e293b;
      background: #f8fafc;
      border: 1px solid #dbe3ec;
      border-radius: 10px;
      box-sizing: border-box;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    button {
      height: 52px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #1e293b;
      background: #e8eef5;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #d8e2ed; }
    button:active { transform: scale(0.97); }
    .operator { background: #f6c453; }
    .operator:hover { background: #edb63c; }
    .equal { background: #7cc58d; grid-column: span 1; }
    .equal:hover { background: #68b67b; }
    .clear { background: #ed6a6d; color: #fff; }
    .clear:hover { background: #df565a; }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" class="display" disabled>
    <div class="buttons">
      <button onclick="clearDisplay()" class="clear">C</button>
      <button onclick="append('/')">/</button>
      <button onclick="append('*')">*</button>
      <button onclick="append('-')" class="operator">-</button>
      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button onclick="append('+')" class="operator">+</button>
      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <div style="grid-column: span 1;"></div>
      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <div style="grid-column: span 1;"></div>
      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button onclick="calculate()" class="equal">=</button>
    </div>
  </div>

  <script>
    let display = document.getElementById("display");

    function append(val) {
      display.value += val;
    }

    function clearDisplay() {
      display.value = "";
    }

    function calculate() {
      try {
        if (display.value.includes("/0")) {
          display.value = "Ошибка: деление на 0";
        } else {
          display.value = eval(display.value);
        }
      } catch {
        display.value = "Ошибка";
      }
    }
  </script>
</body>
</html>
